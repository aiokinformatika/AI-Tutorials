services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # No host port: only the app can reach Ollama over the Compose network.

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/api
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama_models:
